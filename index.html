
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#166534">
<title>مزرعة جدو سيد</title>
<style>
*{box-sizing:border-box}
body{
  font-family:Arial,Tahoma,sans-serif;
  background:#f0fdf4;
  color:#166534;
  margin:0;
  padding:12px
}
header{
  background:#166534;
  color:white;
  padding:15px;
  border-radius:12px;
  text-align:center
}
nav{
  background:white;
  padding:12px;
  margin-top:12px;
  border-radius:10px;
  box-shadow:0 2px 5px #ccc
}
label{display:block;margin:8px 0 4px}
select,input,button,textarea{
  width:100%;
  padding:11px;
  margin:5px 0;
  font-size:16px;
  border:1px solid #bbb;
  border-radius:7px
}
button{
  background:#166534;
  color:white;
  border:0;
  cursor:pointer
}
.card{
  background:white;
  padding:14px;
  border-radius:10px;
  margin-top:12px;
  box-shadow:0 2px 5px #ddd
}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
.stat{
  background:#dcfce7;
  padding:12px;
  border-radius:8px;
  text-align:center
}
.value{font-size:21px;font-weight:bold}
.small{font-size:13px;color:#555}
</style>
</head>
<body>

<header>
  <h2>🐔 مزرعة جدو سيد</h2>
  <div>إدارة دورة تربية الفراخ البيضاء</div>
</header>

<nav>
  <label for="sections"><b>📂 قائمة الأقسام</b></label>
  <select id="sections" onchange="openSection()">
    <option value="">اختر القسم المطلوب</option>
    <option value="01-cycle.html">1 - بيانات الدورة</option>
    <option value="02-daily.html">2 - المتابعة اليومية</option>
    <option value="03-feed.html">3 - العلف والمياه</option>
    <option value="04-weight.html">4 - الأوزان</option>
    <option value="05-health.html">5 - الصحة والتحصينات والنفوق</option>
    <option value="06-store.html">6 - مخزن العلف والمشتريات</option>
    <option value="07-cash.html">7 - الخزنة والمصروفات</option>
    <option value="08-tools.html">8 - الأدوات والمستهلكات</option>
    <option value="09-reports.html">9 - التقارير والمبيعات</option>
  </select>
</nav>

<div class="card">
  <h3>📊 ملخص المزرعة</h3>
  <div class="stats">
    <div class="stat">
      عدد الطيور
      <div class="value" id="birds">0</div>
    </div>
    <div class="stat">
      عمر الدورة
      <div class="value" id="age">-</div>
    </div>
    <div class="stat">
      مخزون العلف
      <div class="value" id="feed">0 كجم</div>
    </div>
    <div class="stat">
      رصيد الخزنة
      <div class="value" id="cash">0 جنيه</div>
    </div>
  </div>
</div>

<div class="card">
  <h3>⚡ إدخال سريع</h3>

  <label>نوع العملية</label>
  <select id="entryType" onchange="changeEntry()">
    <option value="feed">استهلاك علف بالكيلو</option>
    <option value="death">نفوق طيور</option>
    <option value="water">كمية المياه باللتر</option>
    <option value="expense">مصروف نقدي</option>
  </select>

  <label>الكمية أو المبلغ</label>
  <input id="amount" type="number" min="0.01" step="0.01"
         placeholder="أدخل الكمية أو المبلغ">

  <div id="extraField">
    <label>ملاحظات</label>
    <input id="note" placeholder="ملاحظات اختيارية">
  </div>

  <button onclick="saveEntry()">حفظ الإدخال السريع</button>
</div>

<div class="card">
  <h3>💾 حفظ نسخة احتياطية</h3>
  <p class="small">احفظ نسخة من بيانات المزرعة للاحتفاظ بها.</p>
  <button onclick="backup()">تصدير نسخة احتياطية</button>
</div>

<script>
const KEY="farm45";

function getData(){
  try{
    return JSON.parse(localStorage.getItem(KEY))||
      {birds:0,start:"",feed:0,cash:0,logs:[]};
  }catch(e){
    alert("تعذر قراءة البيانات المحفوظة.");
    return {birds:0,start:"",feed:0,cash:0,logs:[]};
  }
}

function saveData(d){
  localStorage.setItem(KEY,JSON.stringify(d));
}

function today(){const x=new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}

function openSection(){
  const page=document.getElementById("sections").value;
  if(page){
    location.href=page;
  }
}

function changeEntry(){
  const type=document.getElementById("entryType").value;
  const input=document.getElementById("amount");

  if(type==="death"){
    input.placeholder="عدد الطيور النافقة";
    input.step="1";
  }else if(type==="water"){
    input.placeholder="كمية المياه باللتر";
    input.step="0.01";
  }else if(type==="expense"){
    input.placeholder="المبلغ بالجنيه";
    input.step="0.01";
  }else{
    input.placeholder="كمية العلف بالكيلو";
    input.step="0.01";
  }
}

function saveEntry(){
  let d=getData();
  d.logs=d.logs||[];

  const type=document.getElementById("entryType").value;
  const amount=Number(document.getElementById("amount").value);
  const note=document.getElementById("note").value.trim();

  if(!Number.isFinite(amount)||amount<=0){
    alert("أدخل قيمة صحيحة أكبر من صفر.");
    return;
  }

  if(type==="death"&&!Number.isInteger(amount)){
    alert("أدخل عدد الطيور كعدد صحيح.");
    return;
  }

  if(type==="feed"){
    if(amount>Number(d.feed||0)){
      alert("الكمية أكبر من مخزون العلف.");
      return;
    }
    d.feed=Number(d.feed||0)-amount;
  }

  if(type==="death"){
    if(amount>Number(d.birds||0)){
      alert("عدد النفوق أكبر من عدد الطيور المسجل.");
      return;
    }
    d.birds=Number(d.birds||0)-amount;
    d.deaths=d.deaths||[];
    d.deaths.push({
      date:today(),
      count:amount,
      note:note
    });
  }

  if(type==="water"){
    d.waterLogs=d.waterLogs||[];
    d.waterLogs.push({
      date:today(),
      qty:amount,
      note:note
    });
  }

  if(type==="expense"){
    if(amount>Number(d.cash||0)){
      if(!confirm("المبلغ أكبر من رصيد الخزنة. هل تريد المتابعة؟")){
        return;
      }
    }

    d.cash=Number(d.cash||0)-amount;
    d.expenses=d.expenses||[];
    d.expenses.push({
      date:today(),
      category:"مصروف من الإدخال السريع",
      amount:amount,
      note:note
    });

    d.cashLogs=d.cashLogs||[];
    d.cashLogs.unshift({
      date:today(),
      type:"expense",
      category:"مصروف من الإدخال السريع",
      amount:amount,
      note:note
    });
  }

  d.logs.push({
    date:today(),
    type:type,
    qty:amount,
    note:note
  });

  saveData(d);
  document.getElementById("amount").value="";
  document.getElementById("note").value="";
  refresh();
  alert("تم حفظ البيانات.");
}

function backup(){
  const data=localStorage.getItem(KEY)||"{}";
  const blob=new Blob([data],{type:"application/json;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="backup-mazraat-gedo-sayed.json";
  a.click();
  URL.revokeObjectURL(url);
}

function refresh(){
  const d=getData();

  document.getElementById("birds").textContent=Number(d.birds)||0;
  document.getElementById("feed").textContent=
    (Number(d.feed)||0).toFixed(2)+" كجم";
  document.getElementById("cash").textContent=
    (Number(d.cash)||0).toFixed(2)+" جنيه";

  if(d.start){
    const start=new Date(d.start+"T00:00:00");
    const now=new Date();
    const age=Math.floor((now-start)/86400000)+1;
    document.getElementById("age").textContent=
      age>0?age+" يوم":"-";
  }else{
    document.getElementById("age").textContent="-";
  }
}

refresh();
</script>
</body>
</html>
